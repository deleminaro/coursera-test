<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud API Player</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light"> <!-- Default theme -->

    <header class="app-header">
        <div class="theme-switch-wrapper">
            <span class="theme-icon sun-icon">☀️</span>
            <label class="theme-switch" for="themeSwitchCheckbox" aria-label="Toggle theme">
                <input type="checkbox" id="themeSwitchCheckbox" />
                <span class="slider round"></span>
            </label>
            <span class="theme-icon moon-icon">🌙</span>
        </div>
    </header>

    <div class="container">
        <h1>SoundCloud Song Search & Play</h1>

        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Search for a song...">
            <button id="searchButton">Search</button>
        </div>

        <div id="player-container" class="player-container" style="display: none;">
            <div id="now-playing" class="now-playing">Now Playing: <span></span></div>
            <audio id="audioPlayer" controls></audio>
        </div>

        <div id="messageArea" class="message-area"></div>
        <div id="results" class="results-grid">
            <!-- Search results will be appended here -->
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
